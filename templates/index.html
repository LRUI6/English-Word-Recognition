<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙模型單字辨識系統</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 20px; }
        h1 { font-size: 1.5rem; color: #333; }
        
        /* 畫布設定：加入 touch-action: none 禁止手機捲動 */
        canvas { 
            background: black; 
            border-radius: 10px; 
            cursor: crosshair; 
            margin-bottom: 10px; 
            touch-action: none; 
            max-width: 100%;
            height: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn { padding: 12px 24px; font-size: 16px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; transition: 0.3s; }
        .btn:active { transform: scale(0.95); }
        
        .result-box { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 280px; }
        h2 { color: #555; font-size: 16px; margin-bottom: 5px; }
        .answer { font-size: 28px; font-weight: bold; color: #6c47f5; min-height: 40px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>✍️ 雙引擎英文單字辨識系統</h1>
    <p>請在下方畫布寫下一個英文單字</p>
    
    <canvas id="drawCanvas" width="600" height="200"></canvas>
    <br>
    <button class="btn" style="background: #e0e0e0;" onclick="clearCanvas()">清空畫布</button>
    <button class="btn" style="background: #6c47f5; color: white;" onclick="predictWord()" id="btnPredict">送出辨識</button>

    <div class="result-box">
        <div class="card">
            <h2>傳統模型 (Tesseract)</h2>
            <div id="resTes" class="answer">?</div>
        </div>
        <div class="card">
            <h2>深度學習模型 (TrOCR)</h2>
            <div id="resTrocr" class="answer">?</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // 初始化畫布
        function init() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }
        init();

        // 取得正確的畫筆座標 (自動處理滑鼠與觸控)
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // 計算比例，避免畫布縮放導致座標偏移
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // --- 事件監聽 ---
        const startDrawing = (e) => {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            if (e.touches) e.preventDefault();
        };

        const draw = (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            if (e.touches) e.preventDefault();
        };

        const stopDrawing = () => isDrawing = false;

        // 滑鼠事件
        canvas.onmousedown = startDrawing;
        canvas.onmousemove = draw;
        canvas.onmouseup = stopDrawing;
        canvas.onmouseout = stopDrawing;

        // 觸控事件
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        function clearCanvas() {
            init();
            document.getElementById('resTes').innerText = '?';
            document.getElementById('resTrocr').innerText = '?';
        }

        async function predictWord() {
            const btn = document.getElementById('btnPredict');
            btn.innerText = '辨識中...';
            const base64Img = canvas.toDataURL('image/png');

            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Img })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('resTes').innerText = data.tesseract_result;
                    document.getElementById('resTrocr').innerText = data.trocr_result;
                } else {
                    alert('發生錯誤: ' + data.error);
                }
            } catch (err) {
                alert('伺服器連線失敗');
            }
            btn.innerText = '送出辨識';
        }
    </script>
</body>
</html>
